name: Build VideoStarTool Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ldid curl wget libxml2-utils

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Tải iOS SDK (cần thiết để biên dịch tweak iOS)
          sudo mkdir -p $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks_temp
          mv $HOME/theos/sdks_temp/*.sdk $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks_temp

      - name: Build Package
        env:
          THEOS: ${{ github.home }}/theos
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-deb
          path: packages/*.deb
