name: Build VideoStarTool Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gioxx/theos:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Package
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-deb
          path: packages/*.deb
